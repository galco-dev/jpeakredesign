<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Checkout — Jobpeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#9a68f8;--dark:#161616;--body:#505050;--muted:#ababab;--border:#e3e3e3;--bg:#f3f3f3;--accent-light:#f0eaff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter Tight',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
nav{position:fixed;top:0;left:0;right:0;padding:1.25rem 2rem;background:#fff;border-bottom:1px solid var(--border);}
.logo{font-size:1.1rem;font-weight:800;letter-spacing:-.5px;color:var(--dark);text-decoration:none;}
.card{background:#fff;border:1px solid var(--border);padding:2.5rem;width:100%;max-width:440px;margin-top:5rem;}
h1{font-size:1.4rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.25rem;}
.sub{color:var(--muted);font-size:.82rem;margin-bottom:1.75rem;display:flex;align-items:center;gap:.4rem;}
.tabs{display:flex;gap:0;margin-bottom:1.75rem;border:1px solid var(--border);}
.tab{flex:1;padding:.7rem;text-align:center;font-size:.88rem;font-weight:700;cursor:pointer;border:none;background:#fff;font-family:'Inter Tight',sans-serif;color:var(--muted);}
.tab.active{background:var(--dark);color:#fff;}
label{display:block;font-size:.78rem;font-weight:700;color:var(--body);margin-bottom:.35rem;letter-spacing:.03em;}
input[type="text"]{width:100%;border:1px solid var(--border);padding:.8rem 1rem;font-family:'Inter Tight',sans-serif;font-size:.9rem;color:var(--dark);outline:none;background:#fff;margin-bottom:1.1rem;}
input:focus{border-color:var(--accent);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.order-summary{border:1px solid var(--border);padding:1rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;}
.order-name{font-size:.88rem;font-weight:600;color:var(--dark);}
.order-price{font-size:1.1rem;font-weight:800;color:var(--dark);}
.btn{display:block;background:var(--accent);color:#fff;font-family:'Inter Tight',sans-serif;font-size:.95rem;font-weight:700;padding:1rem;border:none;cursor:pointer;width:100%;text-align:center;text-decoration:none;margin-bottom:.75rem;}
.btn:hover{opacity:.9;}
.terms-note{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.6;}
.terms-note a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<nav><a href="index.html" class="logo">Jobpeak</a></nav>
<div class="card">
  <h1>Secure Checkout</h1>
  <p class="sub"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Your payment is safe and encrypted.</p>
  <div class="tabs">
    <button class="tab active" onclick="setTab(this,'card')">&#128179; Card</button>
    <button class="tab" onclick="setTab(this,'paypal')">PayPal</button>
  </div>
  <div id="card-form">
    <div class="order-summary">
      <div class="order-name">Cognition Test — Basic Tier</div>
      <div class="order-price">$45.00</div>
    </div>
    <label>Card Number</label>
    <input type="text" placeholder="1234 1234 1234 1234" maxlength="19">
    <div class="row">
      <div><label>Expiry Date</label><input type="text" placeholder="MM / YY" maxlength="7"></div>
      <div><label>CVC</label><input type="text" placeholder="123" maxlength="4"></div>
    </div>
    <a href="payment-success.html" class="btn">Pay $45.00</a>
    <p class="terms-note">By completing this payment, you agree to our <a href="#">Terms &amp; Conditions</a>.</p>
  </div>
  <div id="paypal-form" style="display:none;text-align:center;padding:2rem 0;color:var(--muted);font-size:.9rem;">
    You will be redirected to PayPal to complete payment.<br><br>
    <a href="payment-success.html" class="btn">Continue with PayPal</a>
  </div>
</div>
<script>
function setTab(el,type){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');document.getElementById('card-form').style.display=type==='card'?'block':'none';document.getElementById('paypal-form').style.display=type==='paypal'?'block':'none';}
</script>
</body>
</html>
