<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice Test — Jobpeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#9a68f8;--dark:#161616;--body:#505050;--muted:#ababab;--border:#e3e3e3;--bg:#f3f3f3;--accent-light:#f0eaff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter Tight',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
nav{position:fixed;top:0;left:0;right:0;padding:1.25rem 2rem;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:-.5px;color:var(--dark);text-decoration:none;}
.card{background:#fff;border:1px solid var(--border);padding:3rem 3rem 2.5rem;width:100%;max-width:520px;text-align:center;margin-top:5rem;}
.tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .8rem;margin-bottom:1.5rem;}
h1{font-size:2rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.75rem;}
.sub{color:var(--body);line-height:1.6;margin-bottom:2.5rem;font-size:.95rem;}
.stats{display:flex;gap:0;margin-bottom:2.5rem;border:1px solid var(--border);}
.stat{display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:.82rem;color:var(--body);flex:1;padding:1.25rem 1rem;}
.stat+.stat{border-left:1px solid var(--border);}
.stat-icon{width:42px;height:42px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.stat-val{font-size:1.1rem;font-weight:800;color:var(--dark);}
.btn{display:block;background:var(--accent);color:#fff;font-family:'Inter Tight',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.02em;padding:1rem 2rem;border:none;cursor:pointer;width:100%;text-align:center;text-decoration:none;}
.btn:hover{opacity:.9;}
.note{margin-top:1.25rem;font-size:.78rem;color:var(--muted);}
</style>
</head>
<body>
<nav><a href="index.html" class="logo">Jobpeak</a></nav>
<div class="card">
  <div class="tag">Free &amp; No Payment Required</div>
  <h1>Practice Test</h1>
  <p class="sub">This is a free practice test to help you evaluate your skills and find your ideal qualification tier.</p>
  <div class="stats">
    <div class="stat">
      <div class="stat-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      </div>
      <div class="stat-val">15</div>
      Questions
    </div>
    <div class="stat">
      <div class="stat-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div class="stat-val">5 min</div>
      Duration
    </div>
    <div class="stat">
      <div class="stat-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="stat-val">$0</div>
      No Cost
    </div>
  </div>
  <a href="practice-test-questions.html" class="btn">Start Practice Test</a>
  <p class="note">Results are private and only used to recommend your ideal qualification path.</p>
</div>
</body>
</html>
