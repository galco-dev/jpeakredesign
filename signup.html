<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — Jobpeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#9a68f8;--dark:#161616;--body:#505050;--muted:#ababab;--border:#e3e3e3;--bg:#f3f3f3;--accent-light:#f0eaff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter Tight',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
nav{position:fixed;top:0;left:0;right:0;padding:1.25rem 2rem;background:#fff;border-bottom:1px solid var(--border);}
.logo{font-size:1.1rem;font-weight:800;letter-spacing:-.5px;color:var(--dark);text-decoration:none;}
.card{background:#fff;border:1px solid var(--border);padding:2.5rem;width:100%;max-width:420px;margin-top:5rem;}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.3rem;}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:2rem;}
.social-btn{display:flex;align-items:center;justify-content:center;gap:.75rem;border:1px solid var(--border);padding:.85rem;width:100%;font-family:'Inter Tight',sans-serif;font-size:.88rem;font-weight:600;background:#fff;cursor:pointer;margin-bottom:.65rem;}
.social-btn:hover{background:var(--bg);}
.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.05em;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
label{display:block;font-size:.78rem;font-weight:700;color:var(--body);margin-bottom:.35rem;letter-spacing:.03em;}
input[type="text"],input[type="email"],input[type="password"]{width:100%;border:1px solid var(--border);padding:.8rem 1rem;font-family:'Inter Tight',sans-serif;font-size:.9rem;color:var(--dark);outline:none;background:#fff;margin-bottom:1.1rem;}
input:focus{border-color:var(--accent);}
.btn{display:block;background:var(--dark);color:#fff;font-family:'Inter Tight',sans-serif;font-size:.9rem;font-weight:700;padding:.95rem;border:none;cursor:pointer;width:100%;text-align:center;text-decoration:none;margin-top:.25rem;}
.btn:hover{opacity:.85;}
.login-link{text-align:center;margin-top:1.25rem;font-size:.82rem;color:var(--body);}
.login-link a{color:var(--accent);font-weight:700;text-decoration:none;}
.login-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<nav><a href="index.html" class="logo">Jobpeak</a></nav>
<div class="card">
  <h1>Create Your Account</h1>
  <p class="sub">Start your journey with Jobpeak</p>
  <button class="social-btn">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </button>
  <button class="social-btn">
    <svg width="18" height="18" viewBox="0 0 814 1000" fill="currentColor"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105-37.3-165.9-117.9l-2.6-2.6C222.5 786.5 81 645.4 81 485c0-26.3 1.9-52.6 5.8-78.4 23-120.4 113.1-204.1 215-235.3 42.2-12.9 86.5-19.4 130.8-19.4 44.9 0 87.5 7.7 128.1 22.6 43.5 15.5 84.1 45.2 122.2 45.2 36.5 0 78.4-34 130.8-55.7zm-5.8-90.4c25.1-30.8 41-72.2 41-113.6 0-5.8-.6-11.6-1.3-17.4-38.4 1.3-84.8 25.7-111.6 57.1-23.7 27.5-43.5 68.9-43.5 109.7 0 6.4.6 12.9 1.3 17.4 2.6.6 5.1.6 7.7.6 33.9 0 76.5-23.1 107.4-53.8z"/></svg>
    Continue with Apple
  </button>
  <div class="divider">or</div>
  <label for="name">Full Name</label>
  <input type="text" id="name" placeholder="John Doe">
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="john.doe@example.com">
  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••">
  <a href="email-verification.html" class="btn">Create Account</a>
  <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
</div>
</body>
</html>
