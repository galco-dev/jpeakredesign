<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Successful — Jobpeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#9a68f8;--dark:#161616;--body:#505050;--muted:#ababab;--border:#e3e3e3;--bg:#f3f3f3;--accent-light:#f0eaff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter Tight',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
nav{position:fixed;top:0;left:0;right:0;padding:1.25rem 2rem;background:#fff;border-bottom:1px solid var(--border);}
.logo{font-size:1.1rem;font-weight:800;letter-spacing:-.5px;color:var(--dark);text-decoration:none;}
.card{background:#fff;border:1px solid var(--border);padding:3rem 2.5rem;width:100%;max-width:420px;text-align:center;margin-top:5rem;}
.check-wrap{width:90px;height:90px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.75rem;border:2px solid var(--border);}
.check-inner{width:66px;height:66px;background:var(--dark);border-radius:50%;display:flex;align-items:center;justify-content:center;}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.75rem;}
p{color:var(--body);font-size:.9rem;line-height:1.65;margin-bottom:2rem;}
.receipt{border:1px solid var(--border);padding:1rem 1.25rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;font-size:.88rem;}
.receipt-label{color:var(--muted);font-weight:600;}
.receipt-val{font-weight:800;color:var(--dark);}
.btn{display:block;background:var(--dark);color:#fff;font-family:'Inter Tight',sans-serif;font-size:.95rem;font-weight:700;padding:1rem;border:none;cursor:pointer;width:100%;text-align:center;text-decoration:none;}
.btn:hover{opacity:.85;}
</style>
</head>
<body>
<nav><a href="index.html" class="logo">Jobpeak</a></nav>
<div class="card">
  <div class="check-wrap"><div class="check-inner"><svg width="32" height="32" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div></div>
  <h1>Payment Successful!</h1>
  <p>Your payment of <strong>$45.00</strong> was successful. You now have access to the Cognition Test.</p>
  <div class="receipt"><span class="receipt-label">Order</span><span class="receipt-val">Cognition Test Access</span></div>
  <a href="dashboard.html" class="btn">Go to Dashboard</a>
</div>
</body>
</html>
