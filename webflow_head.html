<!-- STEP 2 — paste into Webflow Page Settings → Inside <head> tag -->

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --accent:#9a68f8;
      --accent-light:#f0eaff;
      --dark:#161616;
      --mid:#292929;
      --body:#505050;
      --muted:#ababab;
      --border:#e3e3e3;
      --bg:#f3f3f3;
      --bg-light:#fbfbfb;
      --white:#ffffff;
    }
    body{font-family:'Inter Tight',sans-serif;color:var(--body);line-height:1.5;letter-spacing:-.03em;background:var(--white);}
    a{color:inherit;text-decoration:none;}

    /* NAV */
    nav{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;max-width:100%;}
    .nav-inner{max-width:1186px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;}
    .nav-logo{font-size:1.1rem;font-weight:700;color:var(--dark);letter-spacing:-.04em;}
    .nav-links{display:flex;gap:2rem;list-style:none;}
    .nav-links a{font-size:.875rem;font-weight:500;color:var(--body);transition:color .15s;}
    .nav-links a:hover{color:var(--dark);}
    .nav-actions{display:flex;align-items:center;gap:1.25rem;}
    .btn-ghost{font-size:.875rem;font-weight:500;color:var(--body);transition:color .15s;}
    .btn-ghost:hover{color:var(--dark);}
    .btn-dark{background:var(--dark);color:var(--white);padding:.5rem 1.1rem;font-size:.875rem;font-weight:600;letter-spacing:-.02em;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;transition:opacity .15s;}
    .btn-dark:hover{opacity:.85;}
    .btn-outline-dark{background:transparent;color:var(--dark);border:1px solid var(--dark);padding:.5rem 1.1rem;font-size:.875rem;font-weight:600;letter-spacing:-.02em;cursor:pointer;display:inline-flex;align-items:center;transition:background .15s;}
    .btn-outline-dark:hover{background:var(--bg);}

    /* HERO */
    .hero-wrap{max-width:1186px;margin:0 auto;padding:100px 24px 80px;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center;}
    .hero-tag{display:inline-block;font-size:.75rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1.25rem;}
    .hero-wrap h1{font-size:2.8rem;font-weight:500;line-height:1.15;color:var(--dark);margin-bottom:1rem;letter-spacing:-.05em;}
    .hero-wrap h1 em{font-style:normal;color:var(--accent);}
    .hero-sub{font-size:1rem;color:var(--body);margin-bottom:1.5rem;line-height:1.6;letter-spacing:-.01em;}
    .hero-bullets{list-style:none;margin-bottom:2rem;display:flex;flex-direction:column;gap:.5rem;}
    .hero-bullets li{display:flex;align-items:center;gap:.6rem;font-size:.9rem;color:var(--body);}
    .hero-bullets li::before{content:"";width:5px;height:5px;background:var(--accent);flex-shrink:0;}
    .hero-ctas{display:flex;gap:.75rem;margin-bottom:2.5rem;flex-wrap:wrap;}
    .hero-ctas .btn-dark,.hero-ctas .btn-outline-dark{padding:.7rem 1.4rem;font-size:.9rem;}
    .trust-row{display:flex;gap:1.75rem;flex-wrap:wrap;padding-top:2rem;border-top:1px solid var(--border);}
    .trust-item{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted);}
    .trust-item strong{color:var(--body);font-weight:600;}

    /* LAPTOP */
    .laptop-outer{position:relative;}
    .laptop-frame{background:#1a1a1a;border-radius:12px 12px 0 0;padding:10px 10px 0;}
    .laptop-bar{width:40px;height:4px;background:#333;border-radius:2px;margin:0 auto 6px;}
    .laptop-screen{background:#fafafa;border-radius:6px 6px 0 0;overflow:hidden;height:340px;display:flex;}
    .laptop-base{height:14px;background:#222;border-radius:0 0 3px 3px;}
    .laptop-foot{width:36%;height:10px;background:#111;margin:0 auto;border-radius:0 0 5px 5px;}
    .db-side{width:105px;background:#0f0f0f;padding:10px 6px;flex-shrink:0;}
    .db-logo-sm{color:white;font-size:.65rem;font-weight:700;padding:4px 8px;margin-bottom:10px;letter-spacing:-.02em;}
    .db-item{padding:5px 8px;font-size:.6rem;color:#666;margin-bottom:1px;}
    .db-item.on{background:#9a68f81a;color:#9a68f8;}
    .db-main{flex:1;padding:10px;overflow:hidden;}
    .db-hi{font-size:.68rem;font-weight:600;color:#161616;margin-bottom:1px;letter-spacing:-.02em;}
    .db-sub-sm{font-size:.55rem;color:#ababab;margin-bottom:8px;}
    .db-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;}
    .db-card{background:white;border:1px solid #e3e3e3;padding:6px;}
    .db-card-lbl{font-size:.5rem;color:#ababab;margin-bottom:2px;}
    .db-card-val{font-size:.78rem;font-weight:600;color:#161616;}
    .db-card-val.g{color:#161616;}
    .db-card-note{font-size:.45rem;color:#ababab;margin-top:1px;}
    .db-sec-lbl{font-size:.58rem;font-weight:600;color:#292929;margin-bottom:4px;}
    .db-row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:white;border:1px solid #e3e3e3;margin-bottom:2px;}
    .db-row-name{font-size:.55rem;color:#161616;}
    .db-row-rate{font-size:.58rem;font-weight:700;color:#9a68f8;}
    .db-dot{width:5px;height:5px;margin-right:4px;flex-shrink:0;background:var(--muted);}

    /* SECTIONS */
    .section{padding:120px 24px;}
    .section.alt{background:var(--bg);}
    .inner{max-width:1186px;margin:0 auto;}
    .overline{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;}
    .overline.center{text-align:center;}
    .sec-title{font-size:2rem;font-weight:500;color:var(--dark);line-height:1.2;letter-spacing:-.04em;margin-bottom:1rem;}
    .sec-title.center{text-align:center;}
    .sec-title em{font-style:normal;color:var(--accent);}
    .sec-sub{font-size:.9rem;color:var(--body);line-height:1.65;letter-spacing:-.01em;}
    .sec-sub.center{text-align:center;max-width:560px;margin:0 auto 3.5rem;}

    /* STEPS */
    .steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:3.5rem;position:relative;}
    .steps::before{content:"";position:absolute;top:calc(1.5rem + 49px);left:calc(12.5% + 52px);right:calc(12.5% + 52px);height:0;border-top:1px dashed var(--muted);z-index:0;}
    .step{background:transparent;padding:1.5rem 1rem 2rem;text-align:center;position:relative;z-index:1;}
    .step-circle{width:100px;height:100px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;position:relative;}
    .step-badge{position:absolute;top:0;left:50%;margin-left:-35px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:white;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0;}
    .step h3{font-size:.95rem;font-weight:700;color:var(--dark);margin-bottom:.5rem;letter-spacing:-.02em;}
    .step p{font-size:.82rem;color:var(--body);line-height:1.6;text-align:center;}

    /* TIERS — black/white/gray + single purple accent */
    .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:3.5rem;}
    .tier-card{background:var(--white);padding:0;display:flex;flex-direction:column;}
    .tier-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
    .tier-body{padding:1.75rem 1.5rem;flex:1;display:flex;flex-direction:column;}
    .tier-tag{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;color:var(--accent);}
    .tier-name{font-size:1.15rem;font-weight:600;color:var(--dark);margin-bottom:.3rem;letter-spacing:-.03em;}
    .tier-desc{font-size:.82rem;color:var(--body);margin-bottom:1rem;line-height:1.55;}
    .tier-badge{display:inline-block;font-size:.68rem;font-weight:600;padding:.25rem .65rem;margin-bottom:1rem;letter-spacing:-.01em;background:var(--bg);color:var(--body);}
    .tier-section-lbl{font-size:.65rem;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;}
    .tier-best{list-style:none;margin-bottom:1rem;}
    .tier-best li{font-size:.8rem;color:var(--body);padding:.2rem 0;display:flex;align-items:center;gap:.5rem;}
    .tier-best li::before{content:"";width:4px;height:4px;background:var(--muted);flex-shrink:0;}
    .tier-feats{list-style:none;margin-bottom:1.25rem;}
    .tier-feats li{font-size:.8rem;color:var(--body);padding:.2rem 0;display:flex;align-items:center;gap:.5rem;}
    .tier-feats li::before{content:"✓";font-weight:700;color:var(--accent);}
    .tier-meta{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1rem;padding-top:.75rem;border-top:1px solid var(--border);}
    .tier-earn{}.tier-earn-lbl{font-size:.65rem;color:var(--muted);}
    .tier-earn-val{font-size:1.6rem;font-weight:600;letter-spacing:-.04em;color:var(--accent);}
    .tier-time{text-align:right;}.tier-time-lbl{font-size:.65rem;color:var(--muted);}
    .tier-time-val{font-size:.9rem;font-weight:700;color:var(--dark);}
    .tier-foot{font-size:.68rem;color:var(--muted);display:flex;gap:.75rem;margin-bottom:1rem;}
    .tier-cta{display:block;text-align:center;padding:.65rem;font-size:.85rem;font-weight:600;background:var(--dark);color:white;border:none;cursor:pointer;letter-spacing:-.01em;transition:opacity .15s;margin-top:auto;}
    .tier-cta:hover{opacity:.8;}

    /* COMPARE */
    .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center;}
    .cmp-table{border:1px solid var(--border);}
    .cmp-head{display:grid;grid-template-columns:2fr 1.1fr 1fr;padding:.75rem 1rem;font-size:.75rem;font-weight:600;color:var(--dark);background:var(--bg);border-bottom:1px solid var(--border);letter-spacing:-.01em;}
    .cmp-head .jp{color:var(--accent);}
    .cmp-row{display:grid;grid-template-columns:2fr 1.1fr 1fr;padding:.75rem 1rem;border-top:1px solid var(--border);font-size:.8rem;align-items:center;}
    .feat{color:var(--body);font-weight:500;}
    .ck{color:var(--dark);font-weight:700;}
    .cx{color:var(--muted);}
    .cmp-right{}
    .cmp-right p{font-size:.9rem;color:var(--body);margin-bottom:2rem;line-height:1.65;letter-spacing:-.01em;}
    .earnings-mock{border:1px solid var(--border);}
    .earnings-top{background:var(--dark);padding:1.25rem;color:white;}
    .earnings-lbl{font-size:.65rem;color:#666;margin-bottom:.3rem;letter-spacing:.02em;}
    .earnings-val{font-size:1.8rem;font-weight:500;letter-spacing:-.04em;}
    .earnings-body{padding:1rem;}
    .earnings-sec{font-size:.68rem;font-weight:600;color:var(--mid);margin-bottom:.5rem;letter-spacing:.02em;}
    .earnings-row{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.78rem;}
    .earnings-row:last-of-type{border-bottom:none;}
    .earn-pos{color:var(--dark);font-weight:600;}
    .earnings-note{font-size:.68rem;color:var(--muted);margin-top:.75rem;letter-spacing:0;}

    /* TESTIMONIALS */
    .testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:2rem;}
    .testi-card{background:var(--white);padding:2rem;}
    .stars{color:#efc42c;font-size:.85rem;margin-bottom:1rem;letter-spacing:.1em;}
    .testi-txt{font-size:.875rem;color:var(--body);margin-bottom:1.5rem;line-height:1.7;letter-spacing:-.01em;}
    .testi-author{display:flex;align-items:center;gap:.6rem;}
    .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.75rem;flex-shrink:0;letter-spacing:0;}
    .a1{background:#292929;}
    .a2{background:#161616;}
    .a3{background:#505050;}
    .author-name{font-size:.82rem;font-weight:600;color:var(--dark);}
    .author-loc{font-size:.7rem;color:var(--muted);}
    .plat-row{display:flex;align-items:center;justify-content:center;gap:2.5rem;flex-wrap:wrap;padding:1.5rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
    .plat{font-size:.8rem;color:var(--body);display:flex;align-items:center;gap:.35rem;}
    .plat strong{color:var(--dark);font-weight:700;}

    /* FAQ */
    .faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;}
    .faq-list{margin-top:2rem;border-top:1px solid var(--border);}
    .faq-item{border-bottom:1px solid var(--border);}
    .faq-q{padding:1rem 0;font-size:.9rem;font-weight:600;color:var(--dark);cursor:pointer;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.02em;user-select:none;}
    .faq-q:hover{color:var(--accent);}
    .faq-q::after{content:"+";font-size:1.1rem;color:var(--muted);flex-shrink:0;transition:transform .2s;}
    .faq-item.open .faq-q::after{content:"−";}
    .faq-a{display:none;padding:0 0 1rem;font-size:.85rem;color:var(--body);line-height:1.7;letter-spacing:-.01em;}
    .faq-item.open .faq-a{display:block;}
    .faq-cta-panel{background:var(--dark);padding:2.5rem;color:white;}
    .faq-cta-over{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:1rem;}
    .faq-cta-panel h3{font-size:1.4rem;font-weight:500;color:white;margin-bottom:.75rem;letter-spacing:-.04em;line-height:1.2;}
    .faq-cta-panel p{font-size:.85rem;color:#aaa;margin-bottom:1.5rem;line-height:1.65;letter-spacing:-.01em;}
    .btn-accent{background:var(--accent);color:white;padding:.7rem 1.4rem;font-size:.875rem;font-weight:600;letter-spacing:-.02em;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;transition:opacity .15s;width:100%;justify-content:center;}
    .btn-accent:hover{opacity:.9;}
    .faq-cta-note{font-size:.72rem;color:#555;margin-top:.75rem;text-align:center;letter-spacing:0;}

    /* FOOT TRUST */
    .foot-trust{background:var(--dark);padding:2.5rem 24px;}
    .foot-trust-inner{max-width:1186px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:.5px;background:var(--mid);}
    .ft{background:var(--dark);padding:1.5rem 1rem;text-align:center;}
    .ft-icon{margin-bottom:.75rem;display:flex;justify-content:center;color:white;}
    .ft-title{font-size:.75rem;font-weight:600;color:white;margin-bottom:.15rem;letter-spacing:-.01em;}
    .ft-sub{font-size:.65rem;color:#555;}

    /* FOOTER */
    footer{background:#0a0a0a;padding:3rem 24px 2rem;}
    .foot-inner{max-width:1186px;margin:0 auto;}
    .foot-top{display:flex;justify-content:space-between;margin-bottom:2.5rem;flex-wrap:wrap;gap:2rem;}
    .foot-brand{}
    .foot-logo{font-size:1.1rem;font-weight:700;color:white;margin-bottom:.4rem;letter-spacing:-.04em;}
    .foot-tag{font-size:.78rem;color:#444;max-width:240px;line-height:1.6;letter-spacing:-.01em;}
    .foot-col h4{font-size:.72rem;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem;}
    .foot-col ul{list-style:none;display:flex;flex-direction:column;gap:.5rem;}
    .foot-col a{font-size:.8rem;color:#555;transition:color .15s;letter-spacing:-.01em;}
    .foot-col a:hover{color:white;}
    .foot-bot{border-top:1px solid #1a1a1a;padding-top:1.5rem;display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:#444;flex-wrap:wrap;gap:1rem;letter-spacing:0;}
    .foot-bot-links{display:flex;gap:1.5rem;}
    .foot-bot-links a{color:#444;transition:color .15s;}
    .foot-bot-links a:hover{color:white;}

    /* RESPONSIVE */
    @media(max-width:1024px){
      .tiers{grid-template-columns:1fr;}
      .steps{grid-template-columns:repeat(2,1fr);}
      .foot-trust-inner{grid-template-columns:repeat(3,1fr);}
    }
    @media(max-width:768px){
      .hero-wrap{grid-template-columns:1fr;padding:60px 24px;}
      .laptop-outer{display:none;}
      .hero-wrap h1{font-size:2rem;}
      .steps{grid-template-columns:1fr;}
      .cmp-grid,.faq-grid{grid-template-columns:1fr;}
      .testi-grid{grid-template-columns:1fr;}
      .foot-trust-inner{grid-template-columns:repeat(2,1fr);}
      nav .nav-links{display:none;}
      .section{padding:80px 24px;}
    }
  </style>
